spring:
  application:
    name: reader-app
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/readerapp}
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

reader:
  storage:
    path: ${BOOK_STORAGE_PATH:./storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.reader: INFO
